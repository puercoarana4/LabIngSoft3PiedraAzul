<form class="formulario" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  <molecule-form-field [error]="errorDe('cedula')">
    <atom-input-text id="medico-cedula" label="Cédula" placeholder="Solo números" [maxLength]="12" formControlName="cedula" />
  </molecule-form-field>
  <molecule-form-field [error]="errorDe('nombres')">
    <atom-input-text id="medico-nombres" label="Nombres" placeholder="Ingrese los nombres" formControlName="nombres" />
  </molecule-form-field>
  <molecule-form-field [error]="errorDe('apellidos')">
    <atom-input-text id="medico-apellidos" label="Apellidos" placeholder="Ingrese los apellidos" formControlName="apellidos" />
  </molecule-form-field>
  <molecule-form-field [error]="errorDe('especialidad')">
    <atom-select id="medico-especialidad" label="Especialidad" placeholder="Seleccione una especialidad" [options]="especialidades" formControlName="especialidad" />
  </molecule-form-field>
  <molecule-form-field [error]="errorDe('aniosTrabajando')">
    <atom-input-text id="medico-anios" label="Años trabajando en la clínica" type="number" placeholder="0" [min]="0" formControlName="aniosTrabajando" />
  </molecule-form-field>
  <molecule-form-field [error]="errorDe('genero')">
    <atom-select id="medico-genero" label="Género" [options]="generos" formControlName="genero" />
  </molecule-form-field>
  <molecule-form-field [error]="errorDe('fechaNacimiento')">
    <atom-input-text id="medico-nacimiento" label="Fecha de nacimiento" type="date" formControlName="fechaNacimiento" />
  </molecule-form-field>

  @if (exito()) {
    <atom-alert tipo="exito">{{ exito() }}</atom-alert>
  }
  @if (error()) {
    <atom-alert tipo="error">{{ error() }}</atom-alert>
  }

  <div class="acciones">
    <atom-button [label]="enviando() ? 'Guardando…' : 'Registrar médico'" [disabled]="enviando()" [fullWidth]="true" />
  </div>
</form>
